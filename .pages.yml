          fields: [title, status, lang, updated, draft]
          sort: [updated, date, title]
          search: [title, description, category, tags]
          default:
            sort: updated
            order: desc
        fields:
          - name: translationKey
            label: Programme ID
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
          - name: lang
            label: Language
            type: select
            required: true
            options:
              values:
                - name: zh
                  label: 中文
                - name: en
                  label: English
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Summary
            type: text
            required: true
          - name: category
            label: Field
            type: string
            required: true
          - name: status
            label: Programme status
            type: select
            required: true
            options:
              values:
                - name: active
                  label: Active
                - name: exploratory
                  label: Exploratory
                - name: paused
                  label: Paused
                - name: completed
                  label: Completed
          - name: tags
            label: Tags
            type: string
            list: true
          - name: date
            label: Start / record date
            type: date
            required: true
          - name: updated
            label: Last updated
            type: date
          - name: featured
            label: Feature on research index
            type: boolean
            default: false
          - name: draft
            label: Keep as draft
            type: boolean
            default: true
          - name: body
            label: Programme description
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: research
      - name: updates
        label: Research log
        type: collection
        path: src/content/updates
        format: yaml-frontmatter
        subfolders: false
        filename:
          template: "{translationKey}.{lang}.md"
          field: create
        view:
          primary: title
          fields: [title, projectKey, recordType, evidence, lang, date, draft]
          sort: [date, title]
          search: [title, description, projectKey, tags]
          default:
            sort: date
            order: desc
        fields:
          - name: translationKey
            label: Record ID
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
          - name: lang
            label: Language
            type: select
            required: true
            options:
              values:
                - name: zh
                  label: 中文
                - name: en
                  label: English
          - name: projectKey
            label: Research programme ID
            type: string
            required: true
            description: "Must match a programme ID, e.g. feynman-periods, quantum-field-theory, riemann-hypothesis, four-color-theorem."
          - name: title
            label: Record title
            type: string
            required: true
          - name: description
            label: Short summary
            type: text
            required: true
          - name: date
            label: Record date
            type: date
            required: true
          - name: recordType
            label: Record type
            type: select
            required: true
            options:
              values:
                - name: snapshot
                  label: Research snapshot
                - name: result
                  label: Result
                - name: verification
                  label: Verification
                - name: conjecture
                  label: Conjecture
                - name: open-problem
                  label: Open problem
                - name: failed-attempt
                  label: Failed attempt
          - name: evidence
            label: Evidence class
            type: select
            required: true
            options:
              values:
                - name: proof
                  label: Proof
                - name: symbolic-check
                  label: Symbolic check
                - name: numerical-check
                  label: Numerical check
                - name: literature
                  label: Literature
                - name: proposal
                  label: Programme snapshot / proposal
                - name: none
                  label: Not classified
          - name: tags
            label: Tags
            type: string
            list: true
          - name: sourceUrl
            label: Supporting source URL
            type: string
          - name: draft
            label: Keep as draft
            type: boolean
            default: true
          - name: body
            label: Detailed record
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: research-log

