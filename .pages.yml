media:
  - name: images
    label: Article images
    input: public/uploads/images
    output: /uploads/images
    extensions: [png, jpg, jpeg, webp, gif]
    categories: [image]
    rename: safe
  - name: documents
    label: Papers and documents
    input: public/uploads/documents
    output: /uploads/documents
    extensions: [pdf, zip]
    categories: [document, compressed]
    rename: safe

content:
  - name: writing
    label: Writing
    type: group
    items:
      - name: journal
        label: Articles & Journal
        type: collection
        path: src/content/journal
        format: yaml-frontmatter
        subfolders: false
        filename:
          template: "{translationKey}.{lang}.md"
          field: create
        view:
          primary: title
          fields: [title, lang, date, draft]
          sort: [date, title]
          search: [title, description, tags]
          default:
            sort: date
            order: desc
        fields:
          - name: translationKey
            label: Article ID (shared by translations)
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
            description: "Use the same ID for the Chinese and English versions, e.g. quantum-notes."
          - name: lang
            label: Language
            type: select
            required: true
            options:
              values:
                - name: zh
                  label: 中文
                - name: en
                  label: English
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Summary / SEO description
            type: text
            required: true
          - name: date
            label: Publication date
            type: date
            required: true
          - name: tags
            label: Tags
            type: string
            list: true
          - name: draft
            label: Keep as draft
            type: boolean
            default: true
            description: "When enabled, this article is excluded from the public site."
          - name: body
            label: Article
            description: "For LaTeX, use Source mode and write $...$ inline or $...$ for display equations."
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: articles
      - name: notes
        label: Notes
        type: collection
        path: src/content/notes
        format: yaml-frontmatter
        subfolders: false
        filename:
          template: "{translationKey}.{lang}.md"
          field: create
        view:
          primary: title
          fields: [title, category, lang, date, draft]
          sort: [date, title]
          search: [title, description, category, tags]
          default:
            sort: date
            order: desc
        fields:
          - name: translationKey
            label: Note ID
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
          - name: lang
            label: Language
            type: select
            required: true
            options:
              values:
                - name: zh
                  label: 中文
                - name: en
                  label: English
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Summary
            type: text
            required: true
          - name: category
            label: Category
            type: string
            required: true
          - name: tags
            label: Tags
            type: string
            list: true
          - name: date
            label: Date
            type: date
            required: true
          - name: updated
            label: Last updated
            type: date
          - name: order
            label: Display order
            type: number
          - name: draft
            label: Keep as draft
            type: boolean
            default: true
          - name: body
            label: Note content
            description: "For LaTeX, use Source mode and write $...$ inline or $...$ for display equations."
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: notes

  - name: research
    label: Research
    type: group
    items:
      - name: programmes
        label: Research programmes
        type: collection
